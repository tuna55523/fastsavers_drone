acro:
  enabled: true
  operator_confirm_required: true
  min_battery_percent: 40
  min_altitude_m: 2.0
  max_wind_mps: 5.0
  cooldown_sec: 4.0

  maneuvers:
    roll_left:
      enabled: true
      max_duration_sec: 1.2
    roll_right:
      enabled: true
      max_duration_sec: 1.2
    front_flip:
      enabled: true
      max_duration_sec: 1.5
    back_flip:
      enabled: true
      max_duration_sec: 1.5

post_check:
  hover_stabilize_sec: 0.8
  require_target_relock: true
  relock_timeout_sec: 2.0
