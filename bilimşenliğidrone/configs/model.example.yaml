detection:
  model_path: models/person_best.pt
  conf_threshold: 0.40
  img_size: 640
  class_filter:
    - person

tracking:
  backend: bytetrack
  max_age: 30
  min_hits: 3
  iou_match_threshold: 0.30

follow_control:
  yaw_kp: 0.24
  yaw_deadzone_px: 10
  yaw_min_cmd: 10
  yaw_max_cmd: 55
  fb_band: 0.10
  fb_min_ratio: 0.72
  fb_max_ratio: 1.32
  fb_max_fwd: 32
  fb_max_bwd: 32
  fb_min_step: 8
